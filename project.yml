name: OpenHealth
packages:
  Inject:
    url: https://github.com/krzysztofzablocki/Inject
    from: 1.5.0
options:
  bundleIdPrefix: com.prasanthdendukuri
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3J6HBM8Q2Z
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  OpenHealth:
    type: application
    platform: iOS
    scheme:
      testTargets: [OpenHealthTests]
      environmentVariables:
        INJECTION_STANDALONE: "1"
    sources:
      - path: OpenHealth
      - path: Shared
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1
        PRODUCT_BUNDLE_IDENTIFIER: com.prasanthdendukuri.openhealth
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OpenHealth/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenHealth/OpenHealth.entitlements
      configs:
        Debug:
          OTHER_LDFLAGS: ["$(inherited)", "-Xlinker", "-interposable"]
          EMIT_FRONTEND_COMMAND_LINES: YES
    dependencies:
      - target: StepsWidget
        embed: true
      - package: Inject
  StepsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StepsWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prasanthdendukuri.openhealth.StepsWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: StepsWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: StepsWidget/StepsWidget.entitlements
  OpenHealthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenHealthTests
    dependencies:
      - target: OpenHealth
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
