name: OpenHealth
packages:
  Inject:
    url: https://github.com/krzysztofzablocki/Inject
    from: 1.5.0
options:
  bundleIdPrefix: com.prasanthdendukuri
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3J6HBM8Q2Z
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  OpenHealth:
    type: application
    platform: iOS
    scheme:
      environmentVariables:
        INJECTION_STANDALONE: "1"
    sources:
      - path: OpenHealth
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1
        PRODUCT_BUNDLE_IDENTIFIER: com.prasanthdendukuri.openhealth
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OpenHealth/Info.plist
      configs:
        Debug:
          OTHER_LDFLAGS: ["$(inherited)", "-Xlinker", "-interposable"]
          EMIT_FRONTEND_COMMAND_LINES: YES
    dependencies:
      - package: Inject
